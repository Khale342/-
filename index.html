<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلباتي - الحوراني</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#222}
header{background:#087f5b;color:white;text-align:center;padding:28px 15px}
header h1{margin:0 0 10px;font-size:32px}
main{max-width:560px;margin:24px auto;padding:16px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 3px 14px #0001}
label{display:block;font-weight:bold;margin:16px 0 7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
textarea{min-height:85px}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:8px;background:#087f5b;color:white;font-size:17px}
.note{font-size:14px;color:#666;line-height:1.7}
</style>
</head>
<body>
<header><h1>🛍️ طلباتي</h1><p>احتياجاتك من محلات قريتك لحد باب بيتك</p></header>
<main><section class="card">
<h2>اعمل طلبك</h2>
<p class="note">اكتب تفاصيل طلبك وعنوانك، وإحنا نساعدك في توصيله.</p>
<form id="orderForm">
<label for="items">تفاصيل الطلب</label>
<textarea id="items" required placeholder="مثال: ٢ كارت شحن فودافون بـ١٥ جنيه"></textarea>
<label for="shop">اسم المحل</label>
<input id="shop" required placeholder="اسم المحل">
<label for="shopAddress">عنوان المحل</label>
<input id="shopAddress" required placeholder="عنوان المحل">
<label for="deliveryAddress">عنوان التوصيل</label>
<input id="deliveryAddress" required placeholder="القرية والمنطقة وأقرب علامة مميزة">
<label for="phone">رقم الموبايل</label>
<input id="phone" type="tel" required placeholder="رقم للتواصل">
<label for="notes">ملاحظات إضافية (اختياري)</label>
<textarea id="notes" placeholder="أي تفاصيل إضافية"></textarea>
<label for="payment">طريقة الدفع</label>
<select id="payment" required>
<option value="">اختار طريقة الدفع</option>
<option value="cash">كاش عند الاستلام</option>
<option value="vodafone">فودافون كاش</option>
</select>
<button type="submit">تأكيد الطلب المبدئي</button>
<p id="message" class="note" aria-live="polite"></p>
</form>
</section></main>
<script>
document.getElementById('orderForm').addEventListener('submit',function(e){
e.preventDefault();
document.getElementById('message').textContent='دي نسخة تجريبية فقط. إرسال الطلبات وحفظها يحتاج ربط الموقع بخادم آمن.';
});
</script>
</body>
</html>
